name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Scripts and workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check shell scripts
        run: shellcheck Scripts/*.sh
      - name: Check workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/checks.yml
  build:
    name: Test and bundle / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-26
            arch: arm64
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check architecture and tools
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          Scripts/doctor.sh
      - name: Check localization tables
        run: python3 Scripts/check-localizations.py
      - name: Run isolated tests
        run: Scripts/with-xcode.sh swift test --jobs 2
      - name: Build release app for the host architecture
        run: |
          app_path="$(Scripts/build-app.sh --configuration release)"
          printf '%s\n' "$app_path" > "$RUNNER_TEMP/app-path"
      # The UI scene check (--ui-smoke-test) runs on a local Mac. Hosted runners
      # do not open the app's main window; see docs/TESTING.md.
      - name: Check the relocated app bundle
        run: |
          app_path="$(cat "$RUNNER_TEMP/app-path")"
          Scripts/check-app.sh "$app_path" --configuration release --arch "${{ matrix.arch }}" --smoke-test
